<!DOCTYPE html>
<html>
<head>
  <title>AI Study Bot</title>
  <style>

    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 15px;
      text-align: center;
      background: #1e293b;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .msg {
      max-width: 60%;
      padding: 10px;
      margin: 10px;
      border-radius: 10px;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .bot {
      background: #334155;
      margin-right: auto;
    }

    #inputArea {
      display: flex;
      padding: 10px;
      background: #1e293b;
    }

    input {
      flex: 1;
      padding: 10px;
    }

    button {
      padding: 10px;
      margin-left: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>🚀 AI Study Bot</header>

<div id="chat"></div>

<div style="padding:10px;">
  <input type="file" id="pdfFile">
  <button onclick="uploadPDF()">Upload PDF</button>
</div>

<div id="inputArea">
  <input id="question" placeholder="Ask something...">
  <button onclick="ask()">Send</button>
</div>

<script>
  const chat = document.getElementById("chat");

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function uploadPDF() {
    let file = document.getElementById("pdfFile").files[0];
    let formData = new FormData();
    formData.append("pdf", file);

    await fetch("/upload", {
      method: "POST",
      body: formData
    });

    addMessage("📄 PDF uploaded!", "bot");
  }

  async function ask() {
    let q = document.getElementById("question").value;

    addMessage(q, "user");
    addMessage("⏳ Thinking...", "bot");

    let res = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: q })
    });

    let data = await res.json();

    chat.lastChild.innerText = data.reply;


  }

</script>

</body>
</html>
